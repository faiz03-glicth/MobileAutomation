# After a failed audit row: gets back to the audited screen (Android Back, up to twice) so the remaining
# rows are still checked from the right place.
appId: ${APP_ID}
---
- runFlow:
    when:
      notVisible:
        id: ${output.audit.screen}
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: ${output.timeouts.animation}
- runFlow:
    when:
      notVisible:
        id: ${output.audit.screen}
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: ${output.timeouts.animation}
